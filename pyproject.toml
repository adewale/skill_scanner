[project]
name = "skill-scanner"
version = "0.1.0"
description = "Security scanner for AI Agent Skills (SKILL.md files)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0",
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pyfakefs>=5.0",
    "ruff==0.16.0",
    "pre-commit>=3.0",
    "vulture>=2.11",
    "bandit>=1.7",
    "pyright>=1.1",
]

[project.scripts]
skill-scanner = "skill_scanner:main"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["skill_scanner"]
omit = ["test_*.py", "conftest.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
required-version = "==0.16.0"
target-version = "py311"
line-length = 79

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
]
ignore = [
    "T201",   # print statements (expected in CLI tool)
    "S101",   # assert statements (expected in tests)
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S", "B", "SIM"]  # Relax security/complexity checks in tests
"conftest.py" = ["S"]

[tool.vulture]
paths = ["skill_scanner.py"]
min_confidence = 80
exclude = ["test_*.py", "conftest.py"]

[tool.bandit]
targets = ["skill_scanner.py"]
skips = ["B310"]  # urllib.request.urlopen - intentional for --url feature

[tool.pyright]
include = ["skill_scanner.py"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
