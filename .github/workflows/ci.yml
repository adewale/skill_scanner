name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hypothesis pytest pytest-cov pyfakefs pyyaml markdown-it-py

      # Branch coverage, enforced by [tool.coverage.report] fail_under in
      # pyproject.toml (set to the measured value; ratchet it up, never down).
      - name: Run tests (with branch coverage floor)
        run: python -m pytest -v --tb=short --cov --cov-branch --cov-report=term-missing

      # Scans committed fixture skills in both directions. (Scanning "."
      # found 0 skills -- the repo root has no SKILL.md -- so it always
      # passed.) test_scanning.py::TestFixtureSkillGate checks the exact
      # findings; this step runs the real CLI gate.
      - name: Self-scan (security gate)
        run: |
          # Known negative: must pass --fail-on-high.
          python skill_scanner.py fixtures/skills/benign --fail-on-high
          # Known positive: must trip --fail-on-high (exit 1). The JSON check
          # tells "HIGH/CRITICAL found" apart from a crash, which also exits 1.
          status=0
          python skill_scanner.py fixtures/skills/malicious-canary --fail-on-high --json > "$RUNNER_TEMP/canary.json" || status=$?
          python -c 'import json, sys; r = json.load(open(sys.argv[2])); n = r["total_high"] + r["total_critical"]; sys.exit(0 if sys.argv[1] == "1" and r["total_skills"] == 1 and n > 0 else f"canary not flagged: exit {sys.argv[1]}, {n} HIGH/CRITICAL")' "$status" "$RUNNER_TEMP/canary.json"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ruff==0.16.0 vulture bandit pyright

      - name: Run ruff check
        run: ruff check --output-format=github .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Dead code detection (vulture)
        run: vulture skill_scanner.py --min-confidence 80

      - name: Security lint (bandit)
        run: bandit -c pyproject.toml -q skill_scanner.py

      - name: Type check (pyright)
        run: pyright skill_scanner.py
