name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyfakefs pyyaml markdown-it-py

      - name: Run tests
        run: python -m pytest -v --tb=short

      - name: Self-scan (security gate)
        run: python skill_scanner.py . --fail-on-high

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ruff vulture bandit pyright

      - name: Run ruff check
        run: ruff check --output-format=github .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Dead code detection (vulture)
        run: vulture skill_scanner.py --min-confidence 80

      - name: Security lint (bandit)
        run: bandit -c pyproject.toml -q skill_scanner.py

      - name: Type check (pyright)
        run: pyright skill_scanner.py
